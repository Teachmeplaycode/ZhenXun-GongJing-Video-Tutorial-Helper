# 帧寻 on linyi.work/ZhenXun. The site's Caddy gateway (zhenyan-evidence) owns ports 80/443 and
# reaches this container as zhenxun:8000 on its network; see deploy/linyi/README.md.
name: zhenxun
services:
  zhenxun:
    build:
      context: ../..
      dockerfile: deploy/linyi/Dockerfile
    image: zhenxun:latest
    container_name: zhenxun
    restart: unless-stopped
    env_file:
      - path: .env          # LLM_* keys and other secrets; never committed
        required: false
    environment:
      ARCHIVE_DIR: /archive   # kept uploads go to the COS bucket (modules/archive.py)
      PUBLIC_URL: https://linyi.work/ZhenXun   # OAuth callbacks come back here
      PUBLIC_PLATFORMS: bilibili,local,alcedo,wechat_channels   # alcedo: 抖音、小红书、快手等; 视频号 needs one's own 元宝 login
      BIND_PLATFORMS: bilibili,yuanbao   # logins each account may link (QR), through CN_PROXY. 小红书 notes parse without a login; its QR login stalls on a security check from the server
      SAMPLE_SESSIONS: d4bf4818677d,29738458d68e,fe983dcf9b59   # 先用示例视频体验: the demo account's VLOOKUP, PS 抠图, 剪映字幕 tutorials
      ASR_BACKEND: paraformer # 百炼 paraformer-v2 (DASHSCOPE_API_KEY in .env); the local whisper is its fallback
    volumes:
      - zhenxun-data:/data
      - /lhcos-data/zhenxun:/archive   # the bucket, mounted on the host with cosfs
    networks:
      edge:
        aliases: [zhenxun]
    cpus: 3
    mem_limit: 8g

volumes:
  zhenxun-data:

networks:
  edge:
    external: true
    name: zhenyan-evidence_default
