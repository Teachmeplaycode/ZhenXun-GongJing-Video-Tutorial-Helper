# 帧见 on linyi.work/GongJing. The site's Caddy gateway (zhenyan-evidence) owns ports 80/443 and
# reaches this container as gongjing:8000 on its network; see deploy/linyi/README.md.
name: gongjing
services:
  gongjing:
    build:
      context: ../..
      dockerfile: deploy/linyi/Dockerfile
    image: gongjing:latest
    container_name: gongjing
    restart: unless-stopped
    env_file:
      - path: .env          # LLM_* keys and other secrets; never committed
        required: false
    volumes:
      - gongjing-data:/data
    networks:
      edge:
        aliases: [gongjing]
    cpus: 3
    mem_limit: 8g

volumes:
  gongjing-data:

networks:
  edge:
    external: true
    name: zhenyan-evidence_default
