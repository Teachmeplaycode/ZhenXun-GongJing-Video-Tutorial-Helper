[project]
name = "gongjing-backend"
version = "0.1.0"
description = "GongJ!ng? backend: link resolvers and remote frame sampling"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "mlx-whisper>=0.4.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
  "python-multipart>=0.0.12",
  "trafilatura>=2.0",
  "ddgs>=9.14",
  "playwright>=1.64.0",
  "segno>=1.6.6",
  "pyobjc-framework-vision>=10 ; sys_platform == 'darwin'",
  "pyobjc-framework-quartz>=10 ; sys_platform == 'darwin'",
  "opencv-python-headless>=5.0.0.93",
  "numpy>=2.4.6",
  "markdown-it-py>=4,<5",
]

[project.optional-dependencies]
# av>=16 dropped the metadata_errors kwarg faster-whisper still passes (seen on aarch64 Linux, 2026-10-20).
cloud = ["faster-whisper>=1.2,<2", "av>=14,<16", "rapidocr-onnxruntime>=1.4,<2"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
# rapidocr-onnxruntime declares a dependency on opencv-python, which needs libGL (absent on
# headless Linux servers) and would sit next to the project's opencv-python-headless — both ship
# the cv2 package, so one breaks the other. Exclusion is stored in uv.lock and honored by
# subsequent syncs; the root headless dependency supplies cv2. Requires a uv version supporting
# exclude-dependencies (validated locally with uv 0.12.9).
exclude-dependencies = ["opencv-python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
