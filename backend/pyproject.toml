[project]
name = "gongjing-backend"
version = "0.1.0"
description = "GongJ!ng? backend: link resolvers and remote frame sampling"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "mlx-whisper>=0.4.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
  "python-multipart>=0.0.12",
  "trafilatura>=2.0",
  "ddgs>=9.14",
  "playwright>=1.64.0",
  "segno>=1.6.6",
  "pyobjc-framework-vision>=10 ; sys_platform == 'darwin'",
  "pyobjc-framework-quartz>=10 ; sys_platform == 'darwin'",
  "opencv-python-headless>=5.0.0.93",
  "numpy>=2.4.6",
  "markdown-it-py>=4,<5",
]

[project.optional-dependencies]
cloud = ["faster-whisper>=1.2,<2", "rapidocr-onnxruntime>=1.4,<2"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
