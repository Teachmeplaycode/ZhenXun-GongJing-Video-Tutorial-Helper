# Every pull request and every push to main runs the backend tests (pytest) and the UI tests
# (Playwright against the in-browser mock backend). Both run on Ubuntu: macOS runners cost 10x the
# minutes of a private repo, and the Mac-only pieces (mlx-whisper, Vision OCR) are platform-gated
# dependencies whose tests skip elsewhere. No secrets are needed: no test calls a model or a platform.
# A push to main that passes both deploys to linyi.work/ZhenXun (the deploy job, deploy/linyi/receive.sh).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # never cut a deploy on main short

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen --python 3.12
      - name: Run tests
        run: uv run pytest -q

  frontend:
    name: Frontend (build + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test --workers=2
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: front/test-results/
          retention-days: 7

  deploy:
    name: Deploy (linyi.work/ZhenXun)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-linyi
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Send the code to the server
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ]; then echo "No DEPLOY_SSH_KEY yet (deploy/linyi/setup-auto-deploy.sh): skipped"; exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key's forced command on the server is receive.sh: it reads this archive and nothing else.
          git archive --format=tar.gz HEAD backend front deploy | ssh -i ~/.ssh/deploy ubuntu@43.160.195.13
